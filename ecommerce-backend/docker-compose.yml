# `docker compose up` starts TWO boxes together: the database + the app.
services:
  # ---- Box 1: the database (Postgres) ----
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Box 2: the backend app (built from our Dockerfile) ----
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ecommerce
      JWT_SECRET: docker-dev-secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
