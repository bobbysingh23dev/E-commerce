name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres, spun up just for this CI run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports: ["5432:5432"]
        # Don't start running steps until Postgres is actually accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # There is no .env file in CI, so the app/tests read these instead.
    # Names must match src/config/db.ts (DB_HOST, DB_PORT, ...).
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ecommerce_test
      JWT_SECRET: test-secret-for-ci

    # Every `run:` step below executes inside the backend package.
    defaults:
      run:
        working-directory: ecommerce-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce_test -f "$f"
          done

      - name: Seed test data
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce_test -f scripts/ci-seed.sql

      - name: Lint
        run: npm run lint

      - name: Build (type-check + compile)
        run: npm run build

      - name: Test
        run: npm test
