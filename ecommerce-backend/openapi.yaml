openapi: 3.0.3
info:
  title: Ecommerce Backend API
  version: 1.0.0
  description: >
    REST API for the ecommerce backend — products, categories, users/auth, and orders.

    **Auth:** obtain a token from `POST /auth/login`, then send it on protected
    requests as a header: `Authorization: Bearer <token>`.

    **Access levels:**
    - **Public** — no token needed for browsing products/categories, register, and login.
    - **Authenticated** — any logged-in user for customer orders, cart, and payment routes.
    - **Staff roles** — workspace endpoints check the caller's role; admins can access all staff workspaces.

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Auth
    description: Registration and login
  - name: Products
    description: Product catalog (reads public, writes require content_editor or admin)
  - name: Categories
    description: Product categories
  - name: Orders
    description: Customer orders (all routes require login)
  - name: Cart
    description: The logged-in user's shopping cart (all routes require login)
  - name: Workspaces
    description: Role-validated staff workspace endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Paste the `jwtToken` from POST /auth/login."

  schemas:
    # ---------- Shared ----------
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Order not found"
    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation failed"
        details:
          type: array
          items:
            type: string
          example: ["price must be a number >= 0"]

    # ---------- Auth ----------
    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, example: "alice@test.com" }
        password: { type: string, minLength: 6, example: "secret123" }
        name: { type: string, example: "Alice" }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "alice@test.com" }
        password: { type: string, example: "secret123" }
    PublicUser:
      type: object
      properties:
        id: { type: integer, example: 2 }
        email: { type: string, example: "alice@test.com" }
        name: { type: string, example: "Alice" }
        role:
          {
            type: string,
            enum:
              [
                customer,
                admin,
                support,
                inventory_manager,
                order_manager,
                finance,
                content_editor,
              ],
            example: "customer",
          }
    LoginResponse:
      type: object
      properties:
        jwtToken:
          { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." }
        user: { $ref: "#/components/schemas/PublicUser" }

    # ---------- Products ----------
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "T-shirt" }
        description: { type: string, nullable: true, example: "Cotton tee" }
        price:
          {
            type: string,
            description: "Decimal returned as a string to preserve precision",
            example: "19.99",
          }
        stock_quantity: { type: integer, example: 100 }
        is_active: { type: boolean, example: true }
        category_id: { type: integer, nullable: true, example: 1 }
        category_name:
          {
            type: string,
            nullable: true,
            description: "Present on list/detail reads (via JOIN)",
            example: "Apparel",
          }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, example: "Hoodie" }
        description:
          { type: string, nullable: true, example: "Warm cotton hoodie" }
        price:
          {
            type: number,
            description: "Send as a JSON number, not a string",
            example: 49.99,
          }
        stock_quantity: { type: integer, default: 0, example: 50 }
        category_id: { type: integer, nullable: true, example: 1 }

    # ---------- Categories ----------
    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Apparel" }
        description:
          { type: string, nullable: true, example: "Clothing and wearables" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Kitchenware" }
        description:
          { type: string, nullable: true, example: "Home & kitchen goods" }

    # ---------- Orders ----------
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, example: 1 }
        quantity: { type: integer, minimum: 1, example: 2 }
    OrderInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItemInput" }
    OrderSummary:
      type: object
      properties:
        id: { type: integer, example: 2 }
        total: { type: string, example: "54.97" }
        status:
          {
            type: string,
            enum: [pending, paid, completed, cancelled],
            example: "pending",
          }
        created_at: { type: string, format: date-time }
    OrderItem:
      type: object
      properties:
        id: { type: integer, example: 3 }
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: "T-shirt" }
        quantity: { type: integer, example: 2 }
        unit_price: { type: string, example: "19.99" }
    OrderDetail:
      type: object
      properties:
        id: { type: integer, example: 2 }
        total: { type: string, example: "54.97" }
        status:
          {
            type: string,
            enum: [pending, paid, completed, cancelled],
            example: "pending",
          }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    StatusInput:
      type: object
      required: [status]
      properties:
        status:
          {
            type: string,
            enum: [pending, paid, completed, cancelled],
            example: "cancelled",
          }
    StockUpdateInput:
      type: object
      required: [stock_quantity, version]
      properties:
        stock_quantity: { type: integer, minimum: 0, example: 24 }
        version: { type: integer, minimum: 1, example: 3 }

    # ---------- Cart ----------
    # NOTE: AddCartItemInput & QuantityInput are GENERATED from Zod at runtime
    # (src/openapi.ts + src/schemas/cart.ts). Edit the Zod schema, not here.
    AddCartItemInput:
      type: object
      description: "(generated from Zod at runtime — placeholder for standalone YAML readers)"
    QuantityInput:
      type: object
      description: "(generated from Zod at runtime — placeholder for standalone YAML readers)"
    CartItemRow:
      type: object
      description: A raw cart_items row (returned by add / update / remove).
      properties:
        id: { type: integer, example: 1 }
        cart_id: { type: integer, example: 1 }
        product_id: { type: integer, example: 1 }
        quantity: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CartLine:
      type: object
      description: A cart item joined to its product (live price + line total).
      properties:
        id: { type: integer, example: 1 }
        product_id: { type: integer, example: 1 }
        product_name: { type: string, example: "T-shirt" }
        price: { type: string, example: "19.99" }
        quantity: { type: integer, example: 3 }
        line_total: { type: string, example: "59.97" }
    CartResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        total: { type: string, example: "59.97" }
        itemCount: { type: integer, example: 1 }

paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (always created as a customer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: "User registered successfully" }
                  newUser: { $ref: "#/components/schemas/PublicUser" }
        "400":
          {
            description: Validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "409":
          {
            description: Email already exists,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LoginResponse" } },
              },
          }
        "400":
          {
            description: Validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "401":
          {
            description: Invalid email or password,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }

  # ==================== PRODUCTS ====================
  /products:
    get:
      tags: [Products]
      summary: List all products (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      tags: [Products]
      summary: Create a product (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "400":
          {
            description: Validation failed or category_id does not exist,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "401":
          {
            description: No/invalid token,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "403":
          {
            description: Not an admin,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Products]
      summary: Get one product (public)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "400":
          {
            description: Invalid id,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "404":
          {
            description: Not found,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
    put:
      tags: [Products]
      summary: Replace a product (admin only, full update)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "400":
          {
            description: Validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "401": { description: No/invalid token }
        "403": { description: Not an admin }
        "404": { description: Not found }
    delete:
      tags: [Products]
      summary: Delete a product (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: Deleted (returns the deleted product),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Product" } },
              },
          }
        "401": { description: No/invalid token }
        "403": { description: Not an admin }
        "404": { description: Not found }

  # ==================== CATEGORIES ====================
  /categories:
    get:
      tags: [Categories]
      summary: List all categories (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: [Categories]
      summary: "Create a category (NOTE: currently public — admin protection planned)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          {
            description: Created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Category" } },
              },
          }
        "400":
          {
            description: Validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "409":
          {
            description: A category with that name already exists,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Categories]
      summary: Get one category (public)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Category" } },
              },
          }
        "400": { description: Invalid id }
        "404": { description: Not found }
    put:
      tags: [Categories]
      summary: "Update a category (NOTE: currently public — admin protection planned)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Category" } },
              },
          }
        "400": { description: Validation failed }
        "404": { description: Not found }
        "409": { description: Name already exists }
    delete:
      tags: [Categories]
      summary: "Delete a category (NOTE: currently public — admin protection planned)"
      responses:
        "200":
          {
            description: Deleted,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Category" } },
              },
          }
        "404": { description: Not found }

  # ==================== ORDERS ====================
  /orders:
    post:
      tags: [Orders]
      summary: Place an order (authenticated). Checks stock, computes total, decrements inventory — all in a transaction.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: "Order created successfully" }
                  order: { $ref: "#/components/schemas/OrderSummary" }
        "400":
          {
            description: "Validation failed, out of stock, or product not found",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "401": { description: No/invalid token }
    get:
      tags: [Orders]
      summary: List the logged-in user's own orders (authenticated)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderSummary" }
        "401": { description: No/invalid token }

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Orders]
      summary: Get one of your own orders with its items (authenticated). 404 if it isn't yours.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/OrderDetail" } },
              },
          }
        "400": { description: Invalid id }
        "401": { description: No/invalid token }
        "404": { description: Not found (or not yours) }
    patch:
      tags: [Orders]
      summary: Update an order's status (authenticated). Cancelling restocks the products (transaction).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/OrderSummary" } },
              },
          }
        "400":
          {
            description: Invalid status or id,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/Error" } },
              },
          }
        "401": { description: No/invalid token }
        "404": { description: Not found (or not yours) }

  # ==================== STAFF WORKSPACES ====================
  /workspaces/support:
    get:
      tags: [Workspaces]
      summary: Get customer-support order queue and workload counts
      description: Available to support staff and admins.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Support summary and up to 50 most recent orders }
        "401": { description: No/invalid token }
        "403": { description: Caller is not support staff or admin }

  /workspaces/inventory:
    get:
      tags: [Workspaces]
      summary: Get stock totals and products needing attention
      description: Available to inventory managers and admins.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          { description: Product, unit, low-stock, and out-of-stock counts }
        "401": { description: No/invalid token }
        "403": { description: Caller is not an inventory manager or admin }

  /workspaces/inventory/products/{id}/stock:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Workspaces]
      summary: Set a product's stock quantity
      description: Inventory managers and admins. Requires the current product version to prevent overwriting concurrent edits.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockUpdateInput" }
      responses:
        "200": { description: Updated stock row with the incremented version }
        "400": { description: Invalid product id, stock quantity, or version }
        "401": { description: No/invalid token }
        "403": { description: Caller is not an inventory manager or admin }
        "404": { description: Product not found }
        "409": { description: Product changed since the submitted version }

  /workspaces/content:
    get:
      tags: [Workspaces]
      summary: Get catalog-content completeness counts
      description: Available to content editors and admins.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: Product,
            category,
            missing-description,
            and missing-image counts,
          }
        "401": { description: No/invalid token }
        "403": { description: Caller is not a content editor or admin }

  /workspaces/orders:
    get:
      tags: [Workspaces]
      summary: Get the order-management queue
      description: Available to order managers and admins.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Orders with customer contact details }
        "401": { description: No/invalid token }
        "403": { description: Caller is not an order manager or admin }

  /workspaces/orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Workspaces]
      summary: Change an order's fulfillment status
      description: Available to order managers and admins. Only valid forward status transitions are accepted.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
      responses:
        "200": { description: Updated order summary }
        "400": { description: Invalid id, status, or status transition }
        "401": { description: No/invalid token }
        "403": { description: Caller is not an order manager or admin }
        "404": { description: Order not found }

  /workspaces/finance:
    get:
      tags: [Workspaces]
      summary: Get finance and sales summary
      description: Available to finance staff and admins.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          { description: Revenue, order, customer, and top-product metrics }
        "401": { description: No/invalid token }
        "403": { description: Caller is not finance staff or admin }

  # ==================== CART ====================
  /cart:
    get:
      tags: [Cart]
      summary: Get the logged-in user's cart with live prices and a computed total
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CartResponse" } },
              },
          }
        "401": { description: No/invalid token }
    delete:
      tags: [Cart]
      summary: Empty the cart (remove all items)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Cart cleared" }
        "401": { description: No/invalid token }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add a product to the cart (re-adding the same product accumulates its quantity)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemInput" }
      responses:
        "201":
          {
            description: Added (returns the cart row),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CartItemRow" } },
              },
          }
        "400":
          {
            description: Validation failed,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ValidationError" } },
              },
          }
        "401": { description: No/invalid token }
        "404": { description: Product not found }

  /cart/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The product's id (a cart line is keyed by product)
        schema: { type: integer }
    patch:
      tags: [Cart]
      summary: Set an exact quantity for a product already in the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuantityInput" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CartItemRow" } },
              },
          }
        "400": { description: Invalid id or quantity }
        "401": { description: No/invalid token }
        "404": { description: That product is not in your cart }
    delete:
      tags: [Cart]
      summary: Remove one product from the cart
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          {
            description: Removed (returns the removed row),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CartItemRow" } },
              },
          }
        "400": { description: Invalid id }
        "401": { description: No/invalid token }
        "404": { description: That product is not in your cart }

  /cart/checkout:
    post:
      tags: [Cart]
      summary: Convert the cart into an order (transaction) and empty it
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
